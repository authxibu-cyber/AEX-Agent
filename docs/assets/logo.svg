<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Crossed swords -->
  <g stroke="#d9a514" stroke-width="2.3" stroke-linecap="round">
    <line x1="10" y1="10" x2="52" y2="52"/>
    <line x1="54" y1="8" x2="12" y2="50"/>
  </g>
  <!-- Sword 1 crossguard (bottom-left) + pommel (top-right) -->
  <g stroke="#d9a514" stroke-width="2.3" stroke-linecap="round">
    <line x1="19" y1="53" x2="13" y2="47"/>
    <circle cx="55.5" cy="6.5" r="2" fill="#d9a514" stroke="none"/>
    <line x1="45" y1="55" x2="51" y2="49"/>
    <circle cx="8.5" cy="6.5" r="2" fill="#d9a514" stroke="none"/>
  </g>
  <!-- Center diamond emblem -->
  <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="#000" stroke="#d9a514" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- X inside the diamond -->
  <g stroke="#d9a514" stroke-width="2.4" stroke-linecap="round">
    <line x1="27.5" y1="27.5" x2="36.5" y2="36.5"/>
    <line x1="36.5" y1="27.5" x2="27.5" y2="36.5"/>
  </g>
</svg>
