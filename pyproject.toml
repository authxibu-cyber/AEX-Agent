[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aex-agent"
version = "1.0.0"
description = "AEX Agent: Autonomous, self-improving AI agent harness with Tier-3 deep architecture, 3-layer persistent memory, dynamic skill synthesis, and multi-channel gateway."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AEX Team & GodEye Mandate", email = "aexagent@internal.ai" }
]
keywords = ["ai-agent", "autonomous-agent", "nous-hermes", "self-improving", "memory", "tui", "gateway"]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "croniter>=2.0.0",
    "click>=8.0.0",
    "beautifulsoup4>=4.12.0",
    "textual>=0.60.0"
]

[project.optional-dependencies]
all = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "python-telegram-bot>=20.0",
    "mcp>=1.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]

[project.scripts]
aex = "aex_agent.cli.main:main"
aex-agent = "aex_agent.agent.core:main"
aex-gateway = "aex_agent.gateway.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aex_agent*", "scripts*"]
